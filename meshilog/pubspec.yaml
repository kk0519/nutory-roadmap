name: meshilog
description: 栄養の家計簿 — Meshilog（メシログ）
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0

  # バーコードスキャン
  mobile_scanner: ^5.0.0

  # 状態管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ローカルDB（文科省食品DB）
  sqflite: ^2.3.3
  path: ^1.9.0

  # HTTP（Open Food Facts API）
  dio: ^5.4.3+1

  # グラフ（週次レポート）
  fl_chart: ^0.68.0

  # カロリーリング
  percent_indicator: ^4.2.3

  # ユーティリティ
  intl: ^0.19.0
  shared_preferences: ^2.3.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/foods.db
