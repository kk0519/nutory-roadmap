name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Write firebase_options.dart placeholder
        working-directory: meshilog/lib
        run: cp firebase_options.dart firebase_options.dart.bak || true

      - name: Install dependencies
        working-directory: meshilog
        run: flutter pub get

      - name: Analyze
        working-directory: meshilog
        run: flutter analyze

      - name: Run tests
        working-directory: meshilog
        run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Write google-services.json
        working-directory: meshilog/android/app
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json

      - name: Write firebase_options.dart
        working-directory: meshilog/lib
        run: echo '${{ secrets.FIREBASE_OPTIONS_DART }}' > firebase_options.dart

      - name: Install dependencies
        working-directory: meshilog
        run: flutter pub get

      - name: Build APK
        working-directory: meshilog
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: meshilog/build/app/outputs/flutter-apk/app-release.apk
